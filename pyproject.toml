[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "wikipedia-interest-skill"
version = "1.0.0"
description = "Agent Skill for analyzing Wikipedia pageview trends across topics and language editions"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
    "matplotlib>=3.8",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]


[tool.setuptools]
py-modules = []